packages:
  - "packages/*"
  - "site"

overrides:
  unrun: 0.2.37
  yaml: ^2.8.3
  # GHSA alerts #338/#346/#347/#349/#350/#363 (fast-uri <3.1.7) and #376-#379 (GHSA-w74x-v6f9-j3xg,
  # GHSA-xhq7-xmqj-769h, GHSA-wjr9-j795-jxcr, GHSA-333x-w4r6-6crp; <3.1.9), reached via fastmcp and the
  # MCP SDK's ajv (^3.0.1). Drop once their lockfile floor is >=3.1.9.
  fast-uri: ^3.1.9
  # GHSA alert #366: source-map-js <1.2.2 (event-loop DoS), reached via Tailwind, css-tree (jsdom, svgo) and
  # Vitest coverage. Dev and site only. Drop once their floors are >=1.2.2.
  source-map-js: ^1.2.2
  # GHSA alert #345: deepmerge-ts <8 (stack exhaustion on recursive objects), via eslint-plugin-functional@10's
  # ^7.1.5. Dev only; the plugin imports only deepmerge(), which 8 keeps. Drop once the plugin allows ^8.
  deepmerge-ts: ^8.0.2
  # GHSA alert #382: GHSA-g3hv-75wg-m249, minimatch >=7.0.0 <11.0.1 (DoS via globparts amplification), reached
  # via ESLint 10 (^10.2.5), @eslint/config-array, @typescript-eslint/typescript-estree, @ts-morph/common,
  # type-coverage-core and TypeDoc. No patched 10.x exists. The full validate passes with ESLint on 11.0.5.
  # Drop once ESLint's floor is >=11.0.1.
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
  # TypeDoc 0.28.20 calls minimatch's matchOne(), which 11.0 removed, so the docs build crashes on 11.
  # Keep TypeDoc on 10 until TypeStrong/typedoc#3151 (minimatch 11) ships, then drop this line.
  "typedoc>minimatch": ^10.2.6
  eslint-plugin-functype: "workspace:*"
  eslint-config-functype: "workspace:*"

# @astrojs/astro2tsx 0.1.2 (under @astrojs/check) pins @emnapi/core 1.11.3 but never declares
# @emnapi/runtime, so pnpm filled @napi-rs/wasm-runtime's runtime peer with the 2.0.0-beta.2 that
# @rolldown/binding-wasm32-wasi pins. The mismatched pair crashes on import, and Astro reports
# @astrojs/check as missing, which failed site#validate (#490, fixed by #501). Keyed to 0.1.2, so it
# stops applying when astro2tsx bumps; drop it then if `astro check` still loads.
packageExtensions:
  "@astrojs/astro2tsx@0.1.2":
    dependencies:
      "@emnapi/runtime": 1.11.3

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "typescript"

minimumReleaseAge: 0

allowBuilds:
  esbuild: true
  sharp: true
  tldjs: true
