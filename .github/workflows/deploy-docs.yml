name: Deploy Docs

on:
  # Deploys from release/1.x until 2.0 ships, so functype.org documents the version npm serves.
  # This filter is the same on main and release/1.x: a push to main deploys nothing. At the 2.0
  # release, set it back to "main" on both branches (see docs/RELEASE.md on main, "Docs and the
  # Claude plugin until 2.0").
  push:
    branches: ["release/1.x"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build functype (needed by site llms-full generator)
        run: pnpm --filter functype build

      - name: Build site
        run: pnpm --filter site build

      - name: Build TypeDoc
        working-directory: packages/functype
        env:
          BROWSER: none
          CI: true
        run: |
          npm config set browser false
          node docs-ci.js

      - name: Prepare combined deployment
        run: |
          mkdir -p dist-combined
          cp -r dist-site/* dist-combined/
          mkdir -p dist-combined/api-docs
          cp -r packages/functype/typedocs/* dist-combined/api-docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-combined

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: "600000"
