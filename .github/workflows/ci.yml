name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Opt-in lint telemetry from ts-builds: per-rule and per-message finding and
# silence counts, never source. TRACE adds this repo's name, the commit, and each
# finding's file and line, so a finding opens on GitHub; it is on because this
# repo is public. Receiver: https://github.com/jordanburke/lint-telemetry
env:
  TS_BUILDS_TELEMETRY: "1"
  TS_BUILDS_TELEMETRY_URL: https://otel.tsnpm.com/v1/lint
  TS_BUILDS_TELEMETRY_TRACE: "1"

jobs:
  validate:
    name: Validate (lint + test + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run turbo validate
        run: pnpm turbo run validate

      # `validate` runs formatters and generators in WRITE mode, so a stale
      # checked-in artifact is silently rewritten and the job still passes.
      # That is how site/public/llms-full.txt sat at v1.8.0 on main after the
      # 1.9.0 release. Fail instead, and say which files drifted.
      - name: Check for uncommitted changes after validate
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::validate modified tracked files — a generated artifact is stale. Run 'pnpm turbo run validate' locally and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  bundle-size:
    name: Bundle size report (packages/functype)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write # for the bundle-size PR comment
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build functype
        run: pnpm --filter functype build

      - name: Calculate bundle sizes
        run: |
          REPORT=packages/functype/bundle-size-report.md
          {
            echo "# Bundle Size Report (packages/functype)"
            echo ""
            echo "## Current Build"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
          } > "$REPORT"
          for file in packages/functype/dist/*.js; do
            size=$(du -h "$file" | cut -f1)
            printf "| %s | %s |\n" "$(basename "$file")" "$size" >> "$REPORT"
          done
          {
            echo ""
            echo "## Gzipped Size (production)"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
          } >> "$REPORT"
          for file in packages/functype/dist/*.js; do
            gzip -c "$file" > "$file.gz"
            size=$(du -h "$file.gz" | cut -f1)
            printf "| %s | %s |\n" "$(basename "$file")" "$size" >> "$REPORT"
            rm "$file.gz"
          done

      - name: Upload bundle size report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: packages/functype/bundle-size-report.md

      - name: Comment on PR with bundle size
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('packages/functype/bundle-size-report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report,
            });
