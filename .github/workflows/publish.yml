name: Publish

# Tag-triggered release. Run `pnpm release patch|minor|major` locally to
# bump versions, sync mirror, sync server.json, commit, and create the tag.
# `git push --follow-tags` triggers this workflow.
#
# The workflow re-validates everything (independent of local validate), runs
# `check-publish-safety` as the final gate (6 invariants — see header of
# scripts/check-publish-safety.ts), then `pnpm -r publish` walks the workspace
# and publishes any package whose version npm doesn't have yet, under the dist-tag `scripts/publish-tag.ts` picked.
# `verify-published` then waits until every package actually installs: npm can
# serve a just-published version as 404 for minutes after "Published" (1.16.1,
# 1.17.0). See the header of scripts/verify-published.ts.
#
# The dist-tag is decided at run time by `scripts/publish-tag.ts`: `latest`, or
# `latest-<major>` for a release on an older line than npm `latest`, such as a
# 1.x fix after 2.0.0. The GitHub release then isn't marked latest, and its notes
# start from the previous tag on the same major.
#
# OIDC trusted publishing for functype, functype-os, functype-log, functype-react
# (provenance attestations). functype-mcp-server and functype-kysely publish with NPM_TOKEN.
# Eslint packages publish with NPM_TOKEN.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # for GitHub releases
      id-token: write # for npm OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm turbo run validate

      - name: Test the release scripts
        run: pnpm test:scripts

      - name: Pick the dist-tag
        id: line
        run: pnpm exec tsx scripts/publish-tag.ts "$GITHUB_REF_NAME"

      - name: Check publish safety
        run: pnpm check-publish-safety
        env:
          # Major bumps require explicit per-release authorization. This
          # workflow runs only on a tag push, so for an intentional major,
          # set the packages here in a release-prep PR (as 2.0.0 did in
          # #582) and set it back to "" in a follow-up PR after the release.
          ALLOW_MAJOR: ""

      - name: Publish to npm
        run: pnpm -r publish --no-git-checks --access public --tag "${{ steps.line.outputs.tag }}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify every package installs from npm
        run: pnpm verify-published
        timeout-minutes: 35
        env:
          NPM_DIST_TAG: ${{ steps.line.outputs.tag }}

      - name: Create GitHub release
        run: |
          args=(--generate-notes --latest="${{ steps.line.outputs.latest }}")
          if [ -n "${{ steps.line.outputs.previous }}" ]; then
            args+=(--notes-start-tag "${{ steps.line.outputs.previous }}")
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
