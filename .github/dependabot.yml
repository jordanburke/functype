version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "@typescript-eslint/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      prettier:
        patterns:
          - "prettier*"
          - "eslint-*-prettier"
      typedoc:
        patterns:
          - "typedoc*"
      tsdown:
        patterns:
          - "tsdown"
          - "tsx"
      # react and react-dom must be the exact same version or the site build
      # aborts. #302 bumped react-dom alone and broke main; grouping makes that
      # specific failure impossible rather than merely caught.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
