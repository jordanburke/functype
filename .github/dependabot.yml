version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "@typescript-eslint/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      prettier:
        patterns:
          - "prettier*"
          - "eslint-*-prettier"
      typedoc:
        patterns:
          - "typedoc*"
      tsdown:
        patterns:
          - "tsdown"
          - "tsx"
      # react and react-dom must be the exact same version or the site build
      # aborts. #302 bumped react-dom alone and broke main; grouping makes that
      # specific failure impossible rather than merely caught.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    ignore:
      # @types/node must match the runtime major pinned in .nvmrc. Types for a
      # newer Node let code compile against APIs the runtime doesn't have
      # (#337 proposed 26 while .nvmrc pins 24). Bump it with .nvmrc, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript@7 is the Go-based rewrite (tsgo). Its exports omit the classic
      # compiler API that functype-eval (ts.sys, getParsedCommandLineOfConfigFile)
      # and the MCP server's validate_code depend on; see 1fffeb0. Move to 7
      # deliberately, once those callers have a replacement.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
